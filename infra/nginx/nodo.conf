upstream api {
    server api:3001;
}

upstream web {
    server web:3000;
}

upstream admin {
    server admin:3003;
}

upstream kitchen {
    server kitchen:3002;
}

server {
    listen 80;
    server_name nodo.cafe;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nodo.cafe;

    # SSL configured via Nginx Proxy Manager
    ssl_certificate /etc/nginx/certs/nodo.cafe.crt;
    ssl_certificate_key /etc/nginx/certs/nodo.cafe.key;

    # Customer PWA
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket support for realtime
    location /socket.io {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # API
    location /api {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.nodo.cafe;

    location / {
        proxy_pass http://admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl http2;
    server_name kitchen.nodo.cafe;

    location / {
        proxy_pass http://kitchen;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
