version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nodo-postgres
    environment:
      POSTGRES_DB: nodoos
      POSTGRES_USER: nodoos
      POSTGRES_PASSWORD: nodoos_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodoos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nodo-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: nodo-api
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://nodoos:nodoos_dev_password@postgres:5432/nodoos
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      PORT: 3001
    volumes:
      - ./apps/api/src:/app/src
      - /app/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: nodo-web
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001

  kitchen:
    build:
      context: .
      dockerfile: apps/kitchen/Dockerfile.dev
    container_name: nodo-kitchen
    ports:
      - "3002:3002"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.dev
    container_name: nodo-admin
    ports:
      - "3003:3003"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001

  forecasting:
    build:
      context: ./apps/forecasting
    container_name: nodo-forecasting
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
